<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Mapper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#1a1a1a;color:#e0e0e0}
#editor-app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;background:#252525;border-bottom:1px solid #333;align-items:center;z-index:10}
#toolbar .title{font-weight:700;font-size:14px;margin-right:8px}
#toolbar .divider{width:1px;height:20px;background:#444;margin:0 4px}
#toolbar button,#toolbar select{padding:7px 11px;border:none;border-radius:6px;background:#3a3a3a;color:#e0e0e0;cursor:pointer;font-size:13px}
#toolbar button:hover{background:#4a4a4a}
#toolbar button.primary{background:#4a7aff}#toolbar button.primary:hover{background:#5a8aff}
#toolbar button.danger{background:#7a3a3a}#toolbar button.danger:hover{background:#8a4a4a}
#toolbar button.active{background:#ff6a6a}
#toolbar .spacer{flex:1}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:280px;background:#222;border-right:1px solid #333;display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
#sidebar h3{padding:11px 14px;font-size:11px;text-transform:uppercase;color:#888;letter-spacing:.8px;background:#1e1e1e;border-top:1px solid #333;border-bottom:1px solid #333}
#sidebar h3:first-child{border-top:none}
#surface-list,#projector-list,#media-library{overflow-y:auto;max-height:30vh}
.surface-item{padding:10px 14px;border-bottom:1px solid #2a2a2a;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px}
.surface-item:hover{background:#2a2a2a}
.surface-item.selected{background:#2e3d5e;border-left:3px solid #4a7aff;padding-left:11px}
.surface-item .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.surface-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.surface-item .del{color:#666;font-size:18px;line-height:1;padding:0 4px;border-radius:4px;opacity:0;cursor:pointer}
.surface-item:hover .del{opacity:1}.surface-item .del:hover{color:#ff6a6a;background:#333}
.empty-hint{padding:16px 14px;color:#666;font-size:12px;text-align:center;line-height:1.7}
.projector-item{padding:10px 14px;border-bottom:1px solid #2a2a2a;font-size:12px}
.projector-item .header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.projector-item .header .title{flex:1;font-weight:600;font-size:13px}
.projector-item .header .dot{width:8px;height:8px;border-radius:50%;background:#4aff8a}
.projector-item .header .del{color:#666;font-size:18px;cursor:pointer;padding:0 4px;border-radius:4px}
.projector-item .header .del:hover{color:#ff6a6a;background:#333}
.projector-item .controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.projector-item .controls label{display:flex;align-items:center;gap:4px;color:#999;font-size:11px}
.projector-item .controls input{width:100%;padding:3px 5px;background:#333;color:#e0e0e0;border:1px solid #444;border-radius:4px;font-size:11px}
.projector-item .blend-row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.projector-item .blend-row label{display:flex;align-items:center;gap:4px;color:#777;font-size:10px}
.projector-item .blend-row input[type=range]{width:100%;accent-color:#4a7aff;height:16px}
.projector-item .actions{display:flex;gap:6px;margin-top:8px}
.projector-item .actions button{flex:1;padding:6px;border:none;border-radius:5px;background:#3a5a8a;color:#fff;cursor:pointer;font-size:11px}
.projector-item .actions button:hover{background:#4a6a9a}
#add-projector{padding:11px 14px;background:#2a3a5a;color:#9ac;border:none;cursor:pointer;width:100%;font-size:12px;font-weight:600}
#add-projector:hover{background:#3a4a6a}
#canvas-wrap{flex:1;position:relative;background:#111;overflow:hidden}
#editor-canvas{display:block;width:100%;height:100%;touch-action:none}
#drop-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:#444;font-size:14px;text-align:center;line-height:1.8;padding:20px}
#properties{position:absolute;bottom:14px;left:14px;background:rgba(30,30,30,.95);border:1px solid #444;border-radius:10px;padding:12px 16px;font-size:12px;display:none;gap:10px;align-items:center;flex-wrap:wrap;backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:calc(100% - 28px)}
#properties.visible{display:flex}
#properties label{color:#999;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:4px}
#properties input[type=range]{width:80px;accent-color:#4a7aff}
#properties input[type=color]{width:32px;height:26px;border:1px solid #555;background:none;cursor:pointer;border-radius:4px;padding:1px}
#properties input[type=number]{width:60px;padding:4px 6px;background:#333;color:#e0e0e0;border:1px solid #444;border-radius:4px;font-size:11px}
#properties input[type=checkbox]{accent-color:#4a7aff}
#properties .value{color:#ccc;min-width:32px;font-variant-numeric:tabular-nums;font-size:11px}
#properties select{padding:4px 6px;background:#333;color:#e0e0e0;border:1px solid #444;border-radius:4px;font-size:12px}
#properties button{padding:5px 11px;border:none;border-radius:5px;background:#3a3a3a;color:#e0e0e0;cursor:pointer;font-size:12px}
#properties button:hover{background:#4a4a4a}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);background:#333;color:#fff;padding:11px 22px;border-radius:8px;font-size:13px;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:1000;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:80vw}
#toast.show{transform:translateX(-50%) translateY(0)}
#output-app{display:none;position:fixed;inset:0;background:#000}
body.output-mode #editor-app{display:none}
body.output-mode #output-app{display:block}
#output-canvas{display:block;width:100vw;height:100vh;background:#000}
#output-fullscreen{position:fixed;top:14px;right:14px;z-index:200;padding:9px 16px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;cursor:pointer;font-size:12px;opacity:.5;transition:opacity .2s}
#output-fullscreen:hover{opacity:1;background:rgba(200,50,50,.7)}
body.output-mode:fullscreen #output-fullscreen{display:none}
#output-label{position:fixed;top:14px;left:14px;z-index:200;padding:9px 16px;background:rgba(0,0,0,.5);color:#fff;border-radius:8px;font-size:12px;opacity:.5;transition:opacity .4s;pointer-events:none}
body.output-mode #output-label{opacity:1}
body.output-mode.identified #output-label{opacity:0}
#tutorial{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center}
#tutorial.visible{display:flex}
#tutorial .card{background:#2a2a2a;border-radius:12px;padding:28px 32px;max-width:460px;border:1px solid #444;box-shadow:0 10px 40px rgba(0,0,0,.6)}
#tutorial h2{font-size:20px;margin-bottom:14px}
#tutorial p{font-size:14px;color:#bbb;line-height:1.6;margin-bottom:16px}
#tutorial .steps{display:flex;gap:6px;margin-bottom:18px}
#tutorial .steps .step{flex:1;height:4px;background:#444;border-radius:2px}
#tutorial .steps .step.active{background:#4a7aff}
#tutorial .actions{display:flex;gap:10px;justify-content:flex-end}
#tutorial button{padding:9px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px;background:#4a4a4a;color:#e0e0e0}
#tutorial button.primary{background:#4a7aff;color:#fff}
#tutorial button.primary:hover{background:#5a8aff}
@media (pointer:coarse){
#toolbar button,#toolbar select{padding:10px 14px;font-size:14px}
.surface-item{padding:14px 16px;font-size:14px}
.surface-item .del{opacity:.6;padding:0 8px}
#properties button,#properties select{padding:9px 14px;font-size:14px}
#properties input[type=range]{width:100px;height:28px}
#properties input[type=number]{padding:6px 8px;font-size:14px}
#properties label{font-size:13px}
.projector-item .controls input{padding:6px 8px;font-size:13px}
.projector-item .actions button{padding:10px;font-size:13px}
.projector-item .header .del{padding:6px 10px}
}
</style>
</head>

<div id="toolbar">
<span class="title">🎯 Simple Mapper</span>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module">
import * as THREE from 'three';
const hashParts=location.hash.slice(1).split('&');
const MODE=hashParts[0]||'editor';
const HASH_PARAMS=Object.fromEntries(hashParts.slice(1).map(p=>p.split('=').map(decodeURIComponent)));
const IS_OUTPUT=MODE==='output';
const PROJECTOR_ID=IS_OUTPUT?parseInt(HASH_PARAMS.projector,10):null;
const IS_COARSE=window.matchMedia('(pointer: coarse)').matches;
const HANDLE_RADIUS=IS_COARSE?0.05:0.03;
const state={surfaces:[],projectors:[],mediaLibrary:[],selectedId:null,nextId:1,nextProjectorId:1,blackout:false,aspect:16/9};
const scene=new THREE.Scene();
const editorHelpers=new THREE.Group();
const editorScene=new THREE.Scene();
editorScene.add(editorHelpers);
const projectorPreviewGroup=new THREE.Group();
editorHelpers.add(projectorPreviewGroup);
let renderer,camera,blendScene=null,blendCamera=null,blendMaterial=null;
const canvasEl=IS_OUTPUT?document.getElementById('output-canvas'):document.getElementById('editor-canvas');
renderer=new THREE.WebGLRenderer({canvas:canvasEl,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setClearColor(0x111111,1);
camera=new THREE.OrthographicCamera(-1,1,1,-1,-10,10);
if(IS_OUTPUT){
blendScene=new THREE.Scene();blendCamera=new THREE.Camera();
blendMaterial=new THREE.ShaderMaterial({
transparent:true,depthTest:false,
uniforms:{uBlendL:{value:0},uBlendR:{value:0},uBlendT:{value:0},uBlendB:{value:0}},
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
fragmentShader:`varying vec2 vUv;uniform float uBlendL,uBlendR,uBlendT,uBlendB;
void main(){float fade=1.0;
if(uBlendL>0.001)fade*=smoothstep(0.0,uBlendL,vUv.x);
if(uBlendR>0.001)fade*=smoothstep(0.0,uBlendR,1.0-vUv.x);
if(uBlendT>0.001)fade*=smoothstep(0.0,uBlendT,1.0-vUv.y);
if(uBlendB>0.001)fade*=smoothstep(0.0,uBlendB,vUv.y);
gl_FragColor=vec4(0.0,0.0,0.0,1.0-fade);}`
});
blendScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),blendMaterial));
}
class Surface{
constructor(opts={}){
this.id=opts.id||state.nextId++;
this.name=opts.name||`Surface ${this.id}`;
this.gridW=opts.gridW||3;this.gridH=opts.gridH||3;
this.color=opts.color||'#4a7aff';this.opacity=opts.opacity??1;
this.mirrorX=!!opts.mirrorX;this.mirrorY=!!opts.mirrorY;
this.inPoint=opts.inPoint||0;this.outPoint=opts.outPoint||0;
this.mediaUrl=null;this.mediaType=null;this.mediaEl=null;this.texture=null;
this.mesh=null;this.outline=null;this.handles=[];this.objectUrl=null;
if(opts.points&&opts.points.length===this.gridW*this.gridH)this.points=opts.points.map(p=>({x:p.x,y:p.y}));
else this.points=this.defaultGrid();
this.buildMesh();
if(!IS_OUTPUT)this.buildHelpers();
}
defaultGrid(){
const pts=[];
for(let y=0;y<this.gridH;y++)for(let x=0;x<this.gridW;x++)
pts.push({x:-0.5+x/(this.gridW-1),y:0.5-y/(this.gridH-1)});
return pts;
}
buildMesh(){
if(this.mesh){scene.remove(this.mesh);this.mesh.geometry.dispose();this.mesh.material.dispose();}
const n=this.gridW*this.gridH;
const positions=new Float32Array(n*3),uvs=new Float32Array(n*2);
for(let i=0;i<n;i++){
const p=this.points[i];positions[i*3]=p.x;positions[i*3+1]=p.y;positions[i*3+2]=0;
const gx=i%this.gridW,gy=Math.floor(i/this.gridW);
uvs[i*2]=gx/(this.gridW-1);uvs[i*2+1]=1-gy/(this.gridH-1);
}
const indices=[];
for(let y=0;y<this.gridH-1;y++)for(let x=0;x<this.gridW-1;x++){
const a=y*this.gridW+x,b=a+1,c=a+this.gridW,d=c+1;
indices.push(a,b,c,b,d,c);
}
const geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
geo.setAttribute('uv',new THREE.BufferAttribute(uvs,2));
geo.setIndex(indices);
const mat=new THREE.ShaderMaterial({
transparent:true,depthTest:false,side:THREE.DoubleSide,
uniforms:{
uMap:{value:this.texture},uHasMap:{value:this.texture?1:0},
uColor:{value:new THREE.Color(this.color)},uOpacity:{value:this.opacity},
uMirrorX:{value:this.mirrorX?1:0},uMirrorY:{value:this.mirrorY?1:0}
},
vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
fragmentShader:`varying vec2 vUv;uniform sampler2D uMap;uniform float uHasMap,uMirrorX,uMirrorY,uOpacity;uniform vec3 uColor;
void main(){vec2 uv=vUv;
if(uMirrorX>0.5&&uv.x>0.5)uv.x=1.0-uv.x;
if(uMirrorY>0.5&&uv.y>0.5)uv.y=1.0-uv.y;
vec4 t=vec4(1.0);if(uHasMap>0.5)t=texture2D(uMap,uv);
gl_FragColor=vec4(t.rgb*uColor,t.a*uOpacity);}`
});
this.mesh=new THREE.Mesh(geo,mat);
scene.add(this.mesh);
}
refreshGeometry(){
if(!this.mesh)return;
const attr=this.mesh.geometry.attributes.position;
for(let i=0;i<this.points.length;i++){attr.array[i*3]=this.points[i].x;attr.array[i*3+1]=this.points[i].y;}
attr.needsUpdate=true;this.mesh.geometry.computeBoundingSphere();
}
buildHelpers(){
this.disposeHelpers();
const outlineGeo=new THREE.BufferGeometry();
outlineGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(12),3));
this.outline=new THREE.LineLoop(outlineGeo,new THREE.LineBasicMaterial({color:0x4a7aff,depthTest:false}));
editorHelpers.add(this.outline);
const handleGeo=new THREE.CircleGeometry(IS_COARSE?0.035:0.022,14);
for(let i=0;i<this.points.length;i++){
const h=new THREE.Mesh(handleGeo,new THREE.MeshBasicMaterial({color:0x4a7aff,depthTest:false}));
h.userData={surfaceId:this.id,pointIndex:i};
editorHelpers.add(h);this.handles.push(h);
}
this.updateHelpers();
}
disposeHelpers(){
if(this.outline){editorHelpers.remove(this.outline);this.outline.geometry.dispose();this.outline.material.dispose();this.outline=null;}
this.handles.forEach(h=>editorHelpers.remove(h));this.handles=[];
}
updateHelpers(){
if(!this.outline)return;
const outer=[this.points[0],this.points[this.gridW-1],this.points[(this.gridH-1)*this.gridW+this.gridW-1],this.points[(this.gridH-1)*this.gridW]];
const pos=this.outline.geometry.attributes.position;
outer.forEach((p,i)=>{pos.array[i*3]=p.x;pos.array[i*3+1]=p.y;});
pos.needsUpdate=true;
for(let i=0;i<this.points.length;i++)this.handles[i].position.set(this.points[i].x,this.points[i].y,0.5);
const sel=this.id===state.selectedId;const color=sel?0x4a7aff:0x667788;
this.outline.material.color.setHex(color);
this.handles.forEach(h=>{h.material.color.setHex(color);h.visible=sel;});
}
setGridResolution(newW,newH){
if(newW===this.gridW&&newH===this.gridH)return;
const oldW=this.gridW,oldH=this.gridH,old=this.points,newPoints=[];
for(let y=0;y<newH;y++)for(let x=0;x<newW;x++){
const u=newW===1?0.5:x/(newW-1),v=newH===1?0.5:y/(newH-1);
const fx=u*(oldW-1),fy=v*(oldH-1);
const x0=Math.floor(fx),y0=Math.floor(fy);
const x1=Math.min(x0+1,oldW-1),y1=Math.min(y0+1,oldH-1);
const tx=fx-x0,ty=fy-y0;
const p00=old[y0*oldW+x0],p10=old[y0*oldW+x1],p01=old[y1*oldW+x0],p11=old[y1*oldW+x1];
newPoints.push({
x:(1-tx)*(1-ty)*p00.x+tx*(1-ty)*p10.x+(1-tx)*ty*p01.x+tx*ty*p11.x,
y:(1-tx)*(1-ty)*p00.y+tx*(1-ty)*p10.y+(1-tx)*ty*p01.y+tx*ty*p11.y
});
}
this.gridW=newW;this.gridH=newH;this.points=newPoints;
this.buildMesh();
if(!IS_OUTPUT)this.buildHelpers();
}
setMedia(el,type,url){
this.mediaEl=el;this.mediaType=type;this.mediaUrl=url;
if(this.texture)this.texture.dispose();
if(!el){
this.texture=null;
if(this.mesh?.material?.uniforms){this.mesh.material.uniforms.uMap.value=null;this.mesh.material.uniforms.uHasMap.value=0;}
return;
}
this.texture=(el instanceof HTMLCanvasElement)?new THREE.CanvasTexture(el):new THREE.Texture(el);
this.texture.colorSpace=THREE.SRGBColorSpace;
this.texture.minFilter=THREE.LinearFilter;this.texture.magFilter=THREE.LinearFilter;
this.texture.needsUpdate=true;
if(this.mesh?.material?.uniforms){this.mesh.material.uniforms.uMap.value=this.texture;this.mesh.material.uniforms.uHasMap.value=1;}
}
update(){
if(this.mediaType==='video'&&this.mediaEl){
const t=this.mediaEl.currentTime;const inP=this.inPoint||0;const outP=this.outPoint||0;
if(inP&&t<inP-0.05)this.mediaEl.currentTime=inP;
else if(outP&&t>outP)this.mediaEl.currentTime=inP;
if(!this.mediaEl.paused&&this.texture)this.texture.needsUpdate=true;
}
if(this.mesh?.material?.uniforms){
const u=this.mesh.material.uniforms;
u.uColor.value.set(this.color);u.uOpacity.value=this.opacity;

const rect=canvasEl.getBoundingClientRect();
const nx=(clientX-rect.left)/rect.width,ny=(clientY-rect.top)/rect.height;

function pointInPolygon(p,corners){
let inside=false;
for(let i=0,j=corners.length-1;i<corners.length;j=i++){
const xi=corners[i].x,yi=corners[i].y,xj=corners[j].x,yj=corners[j].y;
if(((yi>p.y)!==(yj>p.y))&&(p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi))inside=!inside;
}
return inside;
}

}
state.projectors.push({id,region,blend:{left:0,right:0,top:0,bottom:0}});
rebuildProjectorPreviews();renderProjectorList();broadcast();
openProjectorWindow(id);
});
$('save-project').addEventListener('click',exportProject);
$('load-project').addEventListener('click',()=>$('project-input').click());
$('project-input').addEventListener('change',async e=>{
if(e.target.files[0])await importProject(e.target.files[0]);
e.target.value='';
});
$('undo-btn').addEventListener('click',undo);
$('redo-btn').addEventListener('click',redo);
$('output-btn').addEventListener('click',()=>{
if(state.projectors.length===0){
const id=state.nextProjectorId++;
state.projectors.push({id,region:{x:0,y:0,w:1,h:1},blend:{left:0,right:0,top:0,bottom:0}});
rebuildProjectorPreviews();renderProjectorList();broadcast();
}
openProjectorWindow(state.projectors[0].id);
});
document.addEventListener('keydown',e=>{
if(e.target.matches('input, textarea, select'))return;
if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();}
if(e.key==='b'||e.key==='B')toggleBlackout();
if((e.key==='Delete'||e.key==='Backspace')&&state.selectedId){e.preventDefault();deleteSurface(state.selectedId);}
});
}
async function handleFiles(files){
for(const file of files){
if(!file.type.startsWith('image/')&&!file.type.startsWith('video/'))continue;
const type=file.type.startsWith('video/')?'video':'image';
const dataUrl=await fileToDataURL(file);
const name=file.name.replace(/\.[^.]+$/,'');
await loadFromUrl(dataUrl,type,name);
}
}
async function loadFromUrl(dataUrl,type,name){
let s=getSelected();
if(!s){const created=await spawnSurfaceWithMedia(dataUrl,type,name);addToMediaLibrary(name||'Média',dataUrl,type);return created;}
pushHistory();
await loadMediaIntoSurface(s,dataUrl,type);
if(name)s.name=name;
renderSurfaceList();updatePropertiesPanel();broadcast();
addToMediaLibrary(name||'Média',dataUrl,type);
}
async function exportProject(){
try{
const zip=new JSZip();
const data=serializeState();
const mediaFolder=zip.folder('media');
for(let i=0;i<data.surfaces.length;i++){
const s=data.surfaces[i];
if(s.mediaUrl&&s.mediaUrl.startsWith('data:')){
const match=s.mediaUrl.match(/^data:([^;]+);base64,(.+)$/);
if(!match)continue;
const mime=match[1];const base64=match[2];
const ext=mime.includes('video')?'mp4':(mime.includes('png')?'png':(mime.includes('svg')?'svg':'jpg'));
const filename=`s${i}_${sanitize(s.name)}.${ext}`;
mediaFolder.file(filename,base64,{base64:true});
s.mediaUrl='media/'+filename;
}
}
data.mediaLibrary=state.mediaLibrary.map(m=>({name:m.name,type:m.type}));
zip.file('project.json',JSON.stringify(data,null,2));
const blob=await zip.generateAsync({type:'blob',compression:'STORE'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;a.download='simple-mapper-'+new Date().toISOString().slice(0,10)+'.zip';a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
toast('Pack ZIP exporté');
}catch(e){console.error(e);toast('Erreur lors de l\'export');}
}
async function importProject(file){
try{
let data;
if(file.name.endsWith('.zip')||file.type==='application/zip'||file.type==='application/x-zip-compressed'){
if(typeof JSZip==='undefined')throw new Error('JSZip non chargé');
const zip=await JSZip.loadAsync(file);
const projFile=zip.file('project.json');
if(!projFile)throw new Error('project.json absent du ZIP');
data=JSON.parse(await projFile.async('string'));
for(const s of data.surfaces){
if(s.mediaUrl&&!s.mediaUrl.startsWith('data:')&&zip.file(s.mediaUrl)){
const blob=await zip.file(s.mediaUrl).async('blob');
s.mediaUrl=await new Promise(resolve=>{
const reader=new FileReader();
reader.onload=()=>resolve(reader.result);
reader.readAsDataURL(blob);
});
}
}
}else{
const text=await file.text();
data=JSON.parse(text);
}
if(!data.mediaLibrary)data.mediaLibrary=[];
pushHistory();
await applyState(data);
broadcast();
toast('Projet importé');
}catch(e){console.error(e);toast('Fichier invalide : '+e.message);}
}
let saveTimer=null;
function scheduleAutoSave(){
clearTimeout(saveTimer);
saveTimer=setTimeout(()=>{
try{localStorage.setItem('simple-mapper-state',JSON.stringify(serializeState()));}catch(e){}
},1500);
}
function loadLocalState(){
try{const s=localStorage.getItem('simple-mapper-state');if(s)return JSON.parse(s);}catch(e){}
return null;
}
function toggleBlackout(){
state.blackout=!state.blackout;
const btn=document.getElementById('blackout');
if(btn){btn.textContent=state.blackout?'⬛ Blackout ON':'⬛ Blackout';btn.classList.toggle('active',state.blackout);}
renderer.setClearColor(state.blackout?0x000000:0x111111,1);
broadcast();
}
function resize(){
if(IS_OUTPUT){
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight,false);
updateOutputCamera();updateBlendUniforms();
}else editorCamera();
}
window.addEventListener('resize',resize);
if(!IS_OUTPUT)new ResizeObserver(editorCamera).observe(document.getElementById('canvas-wrap'));
if(IS_OUTPUT){
document.getElementById('output-label').textContent='Projecteur '+PROJECTOR_ID;
setTimeout(()=>document.body.classList.add('identified'),2000);
document.getElementById('output-fullscreen').addEventListener('click',()=>{document.documentElement.requestFullscreen().catch(()=>{});});
channel.postMessage({type:'hello',projector:PROJECTOR_ID});
setTimeout(()=>channel.postMessage({type:'hello',projector:PROJECTOR_ID}),300);
}
const tutorialSteps=[
{title:'Bienvenue 👋',text:'Simple Mapper transforme votre projecteur en outil de projection mapping créatif. Créez des surfaces, déformez-les, habillez-les de médias — le tout depuis une seule page web.'},
{title:'Créer et déformer',text:'Cliquez sur « + Surface », « ◯ Cercle » ou « T Texte » puis glissez les poignées bleues pour épouser une forme réelle. Changez la grille (2×2 à 8×8) pour courber finement. Ctrl+Z / Ctrl+Y pour annuler.'},
{title:'Projeter',text:'Cliquez sur « ▶ Sortie simple » ou ajoutez plusieurs projecteurs. Glissez les fenêtres sur vos écrans et passez en plein écran. Le blend adoucit les coutures, et l\'export ZIP embarque vos médias.'}
];
function showTutorial(){
if(localStorage.getItem('simple-mapper-tutorial')==='done')return;
const tut=document.getElementById('tutorial');
let step=0;
const render=()=>{
document.getElementById('tut-title').textContent=tutorialSteps[step].title;
document.getElementById('tut-text').textContent=tutorialSteps[step].text;
document.querySelectorAll('#tutorial .step').forEach((el,i)=>el.classList.toggle('active',i===step));
document.getElementById('tut-next').textContent=step===tutorialSteps.length-1?'Commencer':'Suivant';
};
document.getElementById('tut-next').addEventListener('click',()=>{
if(step===tutorialSteps.length-1){tut.classList.remove('visible');localStorage.setItem('simple-mapper-tutorial','done');}
else{step++;render();}
});
document.getElementById('tut-skip').addEventListener('click',()=>{tut.classList.remove('visible');localStorage.setItem('simple-mapper-tutorial','done');});
render();
tut.classList.add('visible');
}
function randomColor(){
const c=['#4a7aff','#ff6a9a','#4aff8a','#ffaa4a','#aa4aff','#4aeaff','#ff4a4a','#ffffff'];
return c[Math.floor(Math.random()*c.length)];
}
function sanitize(str){return (str||'media').replace(/[^a-z0-9]/gi,'_').slice(0,40);}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;
function toast(msg){
const el=document.getElementById('toast');
el.textContent=msg;el.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
resize();
if(!IS_OUTPUT){
const local=loadLocalState();
if(local)applyState(local).then(()=>{if(state.surfaces.length===0)createDemo();});
else createDemo();
updateHistoryButtons();
renderMediaLibrary();
showTutorial();
}
async function createDemo(){
const demoCanvas=document.createElement('canvas');
demoCanvas.width=demoCanvas.height=512;
const ctx=demoCanvas.getContext('2d');
const grad=ctx.createRadialGradient(256,256,20,256,256,380);
grad.addColorStop(0,'#5a8aff');grad.addColorStop(0.6,'#4a4aff');grad.addColorStop(1,'#6a1aff');
ctx.fillStyle=grad;ctx.fillRect(0,0,512,512);
ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;
for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(256,256,100+i*60,0,Math.PI*2);ctx.stroke();}
ctx.fillStyle='#fff';ctx.font='bold 52px sans-serif';
ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('Simple Mapper',256,256);
ctx.font='20px sans-serif';ctx.fillStyle='rgba(255,255,255,0.7)';
ctx.fillText('glissez les coins pour mapper',256,310);
const dataUrl=demoCanvas.toDataURL('image/png');
const s=new Surface({name:'Démo',color:'#ffffff'});
state.surfaces.push(s);
await loadMediaIntoSurface(s,dataUrl,'image');
selectSurface(s.id);renderSurfaceList();broadcast();
}
function animate(){
requestAnimationFrame(animate);
state.surfaces.forEach(s=>s.update());
if(IS_OUTPUT){
renderer.autoClear=false;renderer.clear();
renderer.render(scene,camera);
renderer.render(blendScene,blendCamera);
renderer.autoClear=true;
}else{
renderer.autoClear=false;renderer.clear();
renderer.render(scene,camera);
renderer.clearDepth();
renderer.render(editorScene,camera);
renderer.autoClear=true;
}
}
animate();
