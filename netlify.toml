# Configuration Netlify pour Simple Mapper
[build]
  publish = "dist/simple-mapper-offline-v1.0.0"
  command = "npm run build:offline"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Redirections et en-têtes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Cache long pour les vendor libs
    # (les fichiers statiques n'ont pas de hash, donc on reste prudent)

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/demos/*.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Contexte de branche (previews Netlify pour PRs)
[context.deploy-preview]
  command = "npm run build:offline"

[context.branch-deploy]
  command = "npm run build:offline"